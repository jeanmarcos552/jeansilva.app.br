name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no Lightsail
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: GHCR_TOKEN,GH_REPO
          script: |
            IMAGE="ghcr.io/$GH_REPO:latest"

            echo "→ Autenticando no GHCR..."
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u jeanmarcos552 --password-stdin

            echo "→ Pulling imagem..."
            sudo docker pull $IMAGE

            echo "→ Parando container atual..."
            sudo docker stop portfolio 2>/dev/null || true
            sudo docker rm portfolio 2>/dev/null || true

            echo "→ Subindo novo container..."
            sudo docker run -d \
              --name portfolio \
              --restart unless-stopped \
              -p 3000:3000 \
              $IMAGE

            echo "→ Limpando imagens antigas..."
            sudo docker image prune -f

            echo "✓ Deploy concluído."
